apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'
apply plugin: 'androidx.baselineprofile' // <morsegram> S5: crea i build type nonMinifiedRelease/benchmarkRelease (copia di release + manifest, firma debug = stesso keystore); variantFilter sotto tiene solo afat* </morsegram>

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1' // <morsegram> S5: installa baseline-prof dall'APK (install adb/sideload; da Play arriva come DM) </morsegram>
}

// <morsegram> Android Auto labs: Car App Library "templated messaging" (beta Google: solo internal/closed testing, mai in produzione).
// settings.gradle include :TMessagesProj_CarLabs solo con -PMORSEGRAM_CAR_LABS=true; qui ci si aggancia al modulo (unica fonte di verita')
def morsegramCarLabs = findProject(':TMessagesProj_CarLabs') != null
if (morsegramCarLabs) {
    dependencies {
        implementation project(':TMessagesProj_CarLabs')
    }
}
// </morsegram>

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig.applicationId = APP_PACKAGE


    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz"]
    }

    signingConfigs {
        debug {
            storeFile file(project.findProperty("RELEASE_STORE_FILE") ?: "../TMessagesProj/config/release.keystore") // <morsegram> keystore da ~/.gradle/gradle.properties </morsegram>
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }

        release {
            storeFile file(project.findProperty("RELEASE_STORE_FILE") ?: "../TMessagesProj/config/release.keystore") // <morsegram> keystore da ~/.gradle/gradle.properties </morsegram>
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            applicationIdSuffix ".beta"
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = project.hasProperty('MORSEGRAM_FULL_SYMBOLS') ? 'FULL' : 'SYMBOL_TABLE' // <morsegram> FULL gonfia l'AAB di ~70 MB di DWARF: SYMBOL_TABLE basta a deoffuscare i crash nativi su Play </morsegram>
        }

        standalone {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            applicationIdSuffix ".web"
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = project.hasProperty('MORSEGRAM_FULL_SYMBOLS') ? 'FULL' : 'SYMBOL_TABLE' // <morsegram> FULL gonfia l'AAB di ~70 MB di DWARF: SYMBOL_TABLE basta a deoffuscare i crash nativi su Play </morsegram>
        }

        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = project.hasProperty('MORSEGRAM_FULL_SYMBOLS') ? 'FULL' : 'SYMBOL_TABLE' // <morsegram> FULL gonfia l'AAB di ~70 MB di DWARF: SYMBOL_TABLE basta a deoffuscare i crash nativi su Play </morsegram>
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest.xml'
    }

    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    sourceSets.release {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        bundleAfat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            ext {
                abiVersionCode = 1
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        afat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
            ext {
                abiVersionCode = 9
            }
            buildConfigField "boolean", "BUNDLE", "false"
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app.apk"
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name in ["nonMinifiedRelease", "benchmarkRelease"]) return // <morsegram> S5: il plugin baselineprofile registra callback per OGNI variante dei build type che crea e fallisce se bundleAfat* vengono filtrate; restano varianti mai costruite </morsegram>
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
        versionName APP_VERSION_NAME
        ndkVersion "27.2.12479018"
        // <morsegram> descriptor Android Auto nel manifest (solo notification; notification+template con il modulo labs)
        // e nome del meta-data che il guard tools:node="remove" elimina (con il modulo labs: nome fittizio, resta il minCarApiLevel=7 del modulo)
        manifestPlaceholders += [
                morsegramAutoDesc: morsegramCarLabs ? 'morsegram_auto_desc_labs' : 'morsegram_auto_desc',
                morsegramMinCarApiLevelGuard: morsegramCarLabs ? 'it.iotatec.morsegram.carlabs.minCarApiLevelGuardOff' : 'androidx.car.app.minCarApiLevel'
        ]
        // </morsegram>

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' // , '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.regular'

    lintOptions {
        checkReleaseBuilds false
    }
}

baselineProfile { mergeIntoMain = true; saveInSrc = true; automaticGenerationDuringBuild = false; dexLayoutOptimization = true; variants { afatRelease { from(project(':TMessagesProj_Baseline')) } } } // <morsegram> S5 baseline profile in src/main/generated/baselineProfiles (committato), MAI generato in build (serve un device): ../wear-build.sh :TMessagesProj_App:generateBaselineProfile (MORSEGRAM.md "Velocissimo (B)"); producer solo su afatRelease, standalone/bundleAfat ereditano da main; dexLayoutOptimization = classi di avvio nel dex primario </morsegram>
apply plugin: 'com.google.gms.google-services'
