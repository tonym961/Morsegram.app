// Morsegram per Wear OS — app standalone su TDLib, stesso package e stessa firma dell'app telefono.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'it.iotatec.morsegram.wear'
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId APP_PACKAGE
        minSdkVersion 30          // Wear OS 3+
        targetSdkVersion 35       // Play: Wear OS richiede API 35 (non 36) dal 31/08/2026
        // versionCode unico per form factor: 2 000 000 + versionCode telefono
        versionCode 2000000 + Integer.parseInt(APP_VERSION_CODE)
        versionName APP_VERSION_NAME
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
        // coppia inseparabile (vedi TMessagesProj/build.gradle)
        def mgId = project.findProperty("MORSEGRAM_APP_ID")
        def mgHash = project.findProperty("MORSEGRAM_APP_HASH")
        def mgReal = mgId != null && mgHash != null && !mgId.toString().trim().isEmpty() && !mgHash.toString().trim().isEmpty()
        buildConfigField "int", "APP_ID", (mgReal ? mgId.toString().trim() : "4")
        buildConfigField "String", "APP_HASH", "\"" + (mgReal ? mgHash.toString().trim() : "014b35b6184100b085b0d0572f9b5103") + "\""
        buildConfigField "boolean", "USE_TEST_DC", (project.findProperty("MORSEGRAM_TEST_DC") ?: "false").toString()
    }

    signingConfigs {
        release {
            storeFile file(project.findProperty("RELEASE_STORE_FILE") ?: "../TMessagesProj/config/release.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".beta"   // come il telefono in debug: il Data Layer accoppia solo stesso package + stessa firma
            signingConfig signingConfigs.release
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // TDLib 1.8.65 precompilato (arm64/armv7, allineato 16 KB) con API a coroutine — Apache-2.0.
    // 13.0.0 = ultima versione con compileSdk 36 (la 15 vuole 37); compilata con Kotlin 2.3 → il root build.gradle usa KGP 2.3.21 (upstream è Java puro, non ne risente).
    implementation "dev.g000sha256:tdl-coroutines-android:13.0.0"

    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.4"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4"
    implementation "androidx.compose.ui:ui:1.8.3"
    implementation "androidx.compose.foundation:foundation:1.8.3"
    implementation "androidx.compose.material:material-icons-core:1.7.8"
    implementation "androidx.wear.compose:compose-material:1.5.6"
    implementation "androidx.wear.compose:compose-foundation:1.5.6"
    implementation "androidx.wear.compose:compose-navigation:1.5.6"
    implementation "androidx.navigation:navigation-compose:2.8.9"
    implementation "androidx.wear:wear:1.3.0"                       // utility Wear (ambient/activity); RemoteInputIntentHelper sta in androidx.wear:wear-input: l'app costruisce da sé l'intent REMOTE_INPUT
    implementation "com.google.android.gms:play-services-wearable:19.0.0"   // Data Layer: bridge di login col telefono
    implementation "com.google.firebase:firebase-messaging:24.1.2"
    implementation "com.google.zxing:core:3.5.3"                   // QR di login da far scansionare al telefono
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2"

    // Nessuna libreria in più: androidx.wear:wear e play-services-base trascinano androidx.fragment 1.2.4,
    // che lint segnala come Fatal (InvalidFragmentVersionForActivityResult: Fragment < 1.3.0 non è compatibile
    // con registerForActivityResult di MainActivity). Il vincolo allinea la versione transitiva.
    constraints {
        implementation("androidx.fragment:fragment:1.8.9") {
            because "lint Fatal InvalidFragmentVersionForActivityResult: serve Fragment >= 1.3.0 per le ActivityResult API"
        }
    }
}

apply plugin: 'com.google.gms.google-services'
