// Morsegram — Velocissimo parte B (S5): Baseline/Startup Profile + macrobenchmark.
// Modulo com.android.test agganciato a :TMessagesProj_App. Il plugin androidx.baselineprofile crea (qui e nell'app)
// i build type nonMinifiedRelease (profilo) e benchmarkRelease (misure, R8 attivo) copiando `release`, firma = signingConfigs.debug
// dell'app (stesso keystore di release: si installa sopra l'app gia' loggata senza perdere l'account).
// Comandi, requisiti device e guadagni attesi: MORSEGRAM.md, sezione "Velocissimo (B) — Baseline profile".
apply plugin: 'com.android.test'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'androidx.baselineprofile'

// -PMORSEGRAM_GMD=true → Gradle Managed Device (emulatore headless aosp API 34, scaricato da Gradle) invece del device adb collegato.
def morsegramGmd = providers.gradleProperty('MORSEGRAM_GMD').map { !it.equalsIgnoreCase('false') }.getOrElse(false)

android {
    namespace 'it.iotatec.morsegram.baseline'
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        minSdkVersion 28            // profili ART (speed-profile / DM) da API 28; generazione senza root da API 33
        targetSdkVersion 36
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    targetProjectPath = ':TMessagesProj_App'

    // Stessa dimensione/flavor dell'app, cosi' le varianti combaciano (afatNonMinifiedRelease ↔ app afatNonMinifiedRelease).
    // bundleAfat non serve: l'app lo tiene solo in `release` (variantFilter) e il profilo generato vale per entrambi i flavor.
    flavorDimensions 'minApi'
    productFlavors {
        afat { }
    }

    testOptions {
        managedDevices {
            localDevices {
                pixel6Api34 {
                    device = 'Pixel 6'
                    apiLevel = 34
                    systemImageSource = 'aosp'
                }
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

baselineProfile {
    useConnectedDevices = !morsegramGmd
    if (morsegramGmd) {
        managedDevices += 'pixel6Api34'
    }
    enableEmulatorDisplay = false
}

dependencies {
    implementation 'androidx.test.ext:junit:1.3.0'
    implementation 'androidx.test.uiautomator:uiautomator:2.4.0'
    implementation 'androidx.benchmark:benchmark-macro-junit4:1.5.0'
}
